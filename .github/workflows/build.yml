name: Build Minecraft 26.3
on:
  push:
    branches: [master]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build Fabric
        run: ./gradlew :ModernUI-Fabric:build --no-daemon
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: modernui-mc-26.3-build
          path: |
            fabric/build/libs/*.jar
          if-no-files-found: warn
